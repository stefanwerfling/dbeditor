<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/doc/logo-mark.svg" />
    <title>DB Editor - Database Designer</title>
  </head>
  <body>
    <div class="topbar">
      <span class="topbar-header" id="topbarheader">
        <svg class="topbar-logo" viewBox="0 0 32 32" width="22" height="22" aria-hidden="true">
          <g fill="none" stroke-linecap="round" stroke-linejoin="round">
            <g stroke="currentColor" stroke-width="1.6">
              <ellipse cx="6.5" cy="7" rx="4.5" ry="1.5"/>
              <path d="M2 7v16c0 0.83 2 1.5 4.5 1.5S11 23.83 11 23V7"/>
              <path d="M2 12c0 0.83 2 1.5 4.5 1.5S11 12.83 11 12"/>
              <path d="M2 17c0 0.83 2 1.5 4.5 1.5S11 17.83 11 17"/>
            </g>
            <g stroke="currentColor" stroke-width="1.6">
              <ellipse cx="25" cy="11" rx="4" ry="1.4"/>
              <path d="M21 11v14c0 0.7 1.8 1.4 4 1.4s4-0.7 4-1.4V11"/>
              <path d="M21 16c0 0.7 1.8 1.4 4 1.4s4-0.7 4-1.4"/>
              <path d="M21 21c0 0.7 1.8 1.4 4 1.4s4-0.7 4-1.4"/>
            </g>
            <g stroke="var(--c-fk)" stroke-width="1.6">
              <line x1="13" y1="14" x2="13" y2="18"/>
              <path d="M13 16 H19"/>
              <line x1="19" y1="16" x2="21" y2="14"/>
              <line x1="19" y1="16" x2="21" y2="18"/>
              <line x1="19" y1="16" x2="21" y2="16"/>
            </g>
          </g>
        </svg>
        <span id="topbar-title">DB Editor</span>
        <span id="topbar-version"></span>
        <span id="topbar-database"></span>
      </span>
      <div id="resizer-topbar" class="resizer"></div>
      <div class="buttonbar" id="buttonbar">
        <nav class="menubar" id="menubar" aria-label="Application menu">
          <button class="menubar-item" data-menu="file">File</button>
          <button class="menubar-item" data-menu="edit">Edit</button>
          <button class="menubar-item" data-menu="insert">Insert</button>
          <button class="menubar-item" data-menu="view">View</button>
          <button class="menubar-item" data-menu="generate">Generate</button>
          <button class="menubar-item" data-menu="project">Project</button>
          <button class="menubar-item" data-menu="help">Help</button>
        </nav>
        <span class="undoredobar">
          <button id="undoBtn" class="btn-grey" title="Undo (Ctrl + Z)" aria-label="Undo" disabled>
            <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M3 6.5h6a3 3 0 0 1 0 6H6.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/><path d="M5 4 2.5 6.5 5 9" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
          </button>
          <button id="redoBtn" class="btn-grey" title="Redo (Ctrl + Shift + Z)" aria-label="Redo" disabled>
            <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M11 6.5H5a3 3 0 0 0 0 6h2.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/><path d="M9 4l2.5 2.5L9 9" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
          </button>
        </span>
        <span class="zoombar">
          <button id="zoomOutBtn" class="btn-grey" title="Zoom out (Ctrl + −)" aria-label="Zoom out">
            <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M2 7h10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          </button>
          <button id="zoomResetBtn" class="btn-grey" title="Reset zoom to 100% (Ctrl + 0)">100%</button>
          <button id="zoomInBtn" class="btn-grey" title="Zoom in (Ctrl + +)" aria-label="Zoom in">
            <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M2 7h10M7 2v10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          </button>
          <button id="zoomFitBtn" class="btn-grey" title="Fit everything in view (F)" aria-label="Fit everything in view">
            <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M2 5V2h3M9 2h3v3M12 9v3H9M5 12H2V9" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
          </button>
        </span>
        <span id="topbar-savestate" class="savestate"></span>
      </div>
    </div>

    <div id="main">
      <div id="controls">
        <div class="treeview-search">
          <input id="treeview-search-input" type="search" placeholder="Filter…" />
        </div>
        <div class="treeview" id="treeview"></div>
        <div id="warnings"></div>
      </div>
      <div id="resizer" class="resizer"></div>
      <div id="dbgrid"><div id="dbgrid-zoom"></div></div>
    </div>

    <script type="module" src="editor_frontend/main.ts"></script>
  </body>
</html>
